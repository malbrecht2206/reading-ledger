const CALL_PREFIX = { "Fantasy":"FIC", "Sci-Fi":"SCI", "Sci-Fantasy":"SCF", "Christian":"REL", "Western":"WST", "Historical Fiction":"HIS", "Other":"GEN", "Autobiography, Philosophy":"BIO" };

function callNumber(book){
  const g = (book.genre||"Other").split(",")[0].trim();
  const prefix = CALL_PREFIX[g] || g.slice(0,3).toUpperCase() || "GEN";
  const authorPart = (book.author||"???").replace(/[^A-Za-z]/g,"").slice(0,3).toUpperCase() || "ANO";
  return `${prefix}-${authorPart}-${String(book.id).padStart(3,"0")}`;
}

function fmtHours(h){
  if(h === null || h === undefined || h === "") return null;
  const num = Number(h);
  if(Number.isNaN(num)) return null;
  const hrs = Math.floor(num);
  const mins = Math.round((num - hrs) * 60);
  return `${hrs}h ${mins}m`;
}

function todayISO(){
  return new Date().toISOString().slice(0,10);
}

function monthName(m){
  const names = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return names[m] || "";
}

function finishSortKey(b) {
  if (b.dateCompleted) return b.dateCompleted;
  if (b.yearCompleted) return `${b.yearCompleted}-${String(b.monthCompleted || 12).padStart(2, "0")}-15`;
  return "";
}

function sortBooksWithin(list, mode) {
  const arr = [...list];
  if (mode === "title") {
    arr.sort((a, b) => a.title.localeCompare(b.title));
  } else if (mode === "author") {
    arr.sort((a, b) => (a.author || "").localeCompare(b.author || ""));
  } else if (mode === "pages") {
    arr.sort((a, b) => (a.pages ?? Infinity) - (b.pages ?? Infinity));
  } else {
    arr.sort((a, b) => finishSortKey(b).localeCompare(finishSortKey(a)));
  }
  return arr;
}

function BookCard({ book, onStatusChange, onDelete, reorder, rank, onMoveUp, onMoveDown, canMoveUp, canMoveDown, onSetRank, onOpenEdit }) {
  const [showQuote, setShowQuote] = useState(false);
  const [editingRank, setEditingRank] = useState(false);
  const [rankDraft, setRankDraft] = useState(rank);
  const audio = fmtHours(book.audioHours);

  function commitRank() {
    setEditingRank(false);
    const n = parseInt(rankDraft, 10);
    if (!Number.isNaN(n) && n !== rank) onSetRank(book.id, n);
  }

  return (
    <div style={styles.card} onClick={() => onOpenEdit && onOpenEdit(book)}>
      {reorder && (
        <div style={styles.reorderRow} onClick={e => e.stopPropagation()}>
          {editingRank ? (
            <input
              autoFocus
              type="number"
              min="1"
              style={styles.rankInput}
              value={rankDraft}
              onChange={e => setRankDraft(e.target.value)}
              onBlur={commitRank}
              onKeyDown={e => { if (e.key === "Enter") commitRank(); if (e.key === "Escape") setEditingRank(false); }}
            />
          ) : (
            <span
              style={styles.rankBadge}
              title="Click to set an exact position"
              onClick={() => { setRankDraft(rank); setEditingRank(true); }}
            >
              #{rank}
            </span>
          )}
          <div style={styles.reorderBtns}>
            <button style={{ ...styles.reorderBtn, opacity: canMoveUp ? 1 : 0.3, cursor: canMoveUp ? "pointer" : "default" }} onClick={() => canMoveUp && onMoveUp(book.id)} disabled={!canMoveUp} title="Move up the queue">↑</button>
            <button style={{ ...styles.reorderBtn, opacity: canMoveDown ? 1 : 0.3, cursor: canMoveDown ? "pointer" : "default" }} onClick={() => canMoveDown && onMoveDown(book.id)} disabled={!canMoveDown} title="Move down the queue">↓</button>
          </div>
        </div>
      )}
      <div style={styles.cardTopRow}>
        <span style={styles.callNumber}>{callNumber(book)}</span>
        <StatusStamp status={book.status} />
      </div>
      <div style={styles.cardTitle}>{book.title}</div>
      <div style={styles.cardAuthor}>{book.author || "Unknown author"}</div>
      {book.series && (
        <div style={styles.cardSeries}>
          {book.series}{book.seriesNum ? ` · Book ${book.seriesNum}` : ""}
        </div>
      )}
      <div style={styles.cardMetaRow}>
        {book.pages ? <span style={styles.metaItem}>{Math.round(book.pages)}p</span> : null}
        {audio ? <span style={styles.metaItem}>{audio} audio</span> : null}
        <GenreTag genre={book.genre} />
      </div>
      {book.dateStarted && book.status === "In Progress" && (
        <div style={styles.cardCompleted}>Started {book.dateStarted}</div>
      )}
      {book.yearCompleted && (
        <div style={styles.cardCompleted}>
          Finished {book.dateCompleted ? book.dateCompleted : (book.monthCompleted ? monthName(book.monthCompleted) + " " + book.yearCompleted : book.yearCompleted)}
        </div>
      )}
      {book.quote && (
        <div onClick={e => e.stopPropagation()}>
          <button style={styles.quoteToggle} onClick={() => setShowQuote(s => !s)}>
            <Quote size={12} /> {showQuote ? "hide quote" : "show quote"}
          </button>
          {showQuote && <div style={styles.quoteBlock}>{book.quote}</div>}
        </div>
      )}
      <div style={styles.cardActions} onClick={e => e.stopPropagation()}>
        {book.status === "TBR" && (
          <button style={styles.actionBtn} onClick={() => onStatusChange(book.id, "In Progress")}>
            <Play size={13} /> Start
          </button>
        )}
        {book.status !== "Read" && (
          <button style={styles.actionBtn} onClick={() => onStatusChange(book.id, "Read")}>
            <CheckCircle2 size={13} /> Mark read
          </button>
        )}
        {book.status !== "DNF" && (
          <button style={styles.actionBtnMuted} onClick={() => onStatusChange(book.id, "DNF")}>
            <BookX size={13} /> DNF
          </button>
        )}
        <button style={styles.deleteBtn} onClick={() => onDelete(book.id)}>
          <Trash2 size={13} />
        </button>
      </div>
    </div>
  );
}

    const metaMap = {};
    SEED_SERIES_META.forEach(m => { metaMap[m.series] = m; });

    const rows = Object.entries(bySeries).map(([name, list]) => {
      const meta = metaMap[name];
      const readCount = list.filter(b => b.status === "Read").length;
      const inProgressCount = list.filter(b => b.status === "In Progress").length;
      const dnfCount = list.filter(b => b.status === "DNF").length;
      const trackedTotal = list.length;
      const totalBooks = meta && meta.totalBooks ? Math.max(meta.totalBooks, trackedTotal) : trackedTotal;
      const author = (meta && meta.author) || list[0].author;
      const ongoing = meta ? meta.ongoing === "Y" : false;
      let status;
      if (dnfCount > 0) status = "DNF";
      else if (readCount === 0 && inProgressCount === 0) status = "Not started";
      else if (inProgressCount > 0) status = "Reading";
      else if (readCount >= totalBooks) status = ongoing ? "Caught up" : "Complete";
      else status = "Started";
      return { name, author, readCount, totalBooks, ongoing, status };
    });
    const rank = { "Reading": 0, "Started": 1, "Caught up": 2, "Not started": 3, "DNF": 4, "Complete": 5 };
    rows.sort((a, b) => (rank[a.status] ?? 6) - (rank[b.status] ?? 6) || a.name.localeCompare(b.name));
    return rows;
  }, [books]);

  const filteredSeries = useMemo(() => {
    let list = seriesProgress;
    if (seriesStatusFilter !== "All") list = list.filter(s => s.status === seriesStatusFilter);

    }
    list = [...list].sort((a, b) => {
      if (tbrSort === "priority") return (a.priority ?? 0) - (b.priority ?? 0);
      if (tbrSort === "continuing") {
        const ac = seriesInvested.has(a.series) ? 0 : 1;
        const bc = seriesInvested.has(b.series) ? 0 : 1;
        if (ac !== bc) return ac - bc;
        if (ac === 0) return (a.seriesNum ?? 999) - (b.seriesNum ?? 999);
        return (a.priority ?? 0) - (b.priority ?? 0);

  function reorderTBR(id, targetIndex0) {
    const prev = books;
    const ordered = prev.filter(b => b.status === "TBR").slice().sort((a, b) => (a.priority ?? 0) - (b.priority ?? 0));
    const idx = ordered.findIndex(b => b.id === id);
    if (idx === -1) return;
    const clamped = Math.max(0, Math.min(targetIndex0, ordered.length - 1));
    if (clamped === idx) return;
    const [item] = ordered.splice(idx, 1);
    ordered.splice(clamped, 0, item);
    const priorityMap = {};
    ordered.forEach((b, i) => { priorityMap[b.id] = i; });
    const newList = prev.map(book => (priorityMap[book.id] !== undefined ? { ...book, priority: priorityMap[book.id] } : book));
    persistBooks(newList);
  }

  function moveInQueue(id, direction) {
    const idx = tbrBooks.findIndex(b => b.id === id);
    if (idx === -1) return;
    reorderTBR(id, direction === "up" ? idx - 1 : idx + 1);

      list = list.filter(b => b.title.toLowerCase().includes(q) || (b.author || "").toLowerCase().includes(q) || (b.series || "").toLowerCase().includes(q));
    }
    const groups = {};

    if (libGroupBy === "status") {
      list.forEach(b => {
        const key = STATUS_LABEL[b.status] || b.status;
        if (!groups[key]) groups[key] = [];
        groups[key].push(b);
      });
      const order = ["Currently Reading", "Read", "Did Not Finish"];
      return order.filter(k => groups[k]).map(k => [k, sortBooksWithin(groups[k], libSort)]);
    }

    list.forEach(b => {

      if (b.status === "In Progress") key = "Currently Reading";
      else if (b.status === "DNF") key = b.yearCompleted ? String(b.yearCompleted) : "Did Not Finish";

      groups[key].push(b);

    const entries = Object.entries(groups).map(([k, arr]) => [k, sortBooksWithin(arr, libSort)]);
    entries.sort((a, b) => {
      if (a[0] === "Currently Reading") return -1;
      if (b[0] === "Currently Reading") return 1;
      const aSpecial = Number.isNaN(Number(a[0]));
      const bSpecial = Number.isNaN(Number(b[0]));
      if (aSpecial && bSpecial) return 0;
      if (aSpecial) return 1;
      if (bSpecial) return -1;
      return Number(b[0]) - Number(a[0]);
    });
    return entries;

  async function fetchBookDetails(title, author) {
    const prompt = `Search the web for the book "${title}"${author ? " by " + author : ""}. ` +
      `Reply with ONLY a raw JSON object, no markdown code fences, no commentary before or after. ` +
      `Use exactly these keys: "author" (string, the author's full name(s)), "series" (string or null, the series name if part of one, else null), ` +
      `"seriesNum" (number or null, position in the series), "pages" (number or null, print page count), ` +
      `"audioHours" (number or null, audiobook length in decimal hours, e.g. 12.5), "genre" (short string like "Fantasy" or "Sci-Fi"). ` +
      `If you cannot find a field, use null for it. Do not guess wildly; prefer null over a fabricated number.`;
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
        tools: [{ type: "web_search_20250305", name: "web_search" }],
      }),
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
    const clean = textBlocks.replace(/```json|```/g, "").trim();
    const start = clean.indexOf("{");
    const end = clean.lastIndexOf("}");
    if (start === -1 || end === -1) throw new Error("No JSON found");
    return JSON.parse(clean.slice(start, end + 1));
  }

                    <div style={styles.seriesRowTop}>
                      <span style={styles.seriesName}>{s.name}</span>
                      <span style={{ ...styles.stamp, color: cfg, borderColor: cfg }}>{s.status.toUpperCase()}</span>
                    </div>
                    <div style={styles.seriesAuthor}>{s.author || "Unknown author"}{s.ongoing ? " · ongoing" : ""}</div>
                    <div style={styles.seriesProgressRow}>
                      <div style={styles.seriesProgressTrack}>
                        <div style={{ ...styles.seriesProgressFill, width: `${pct}%`, background: cfg }} />
                      </div>
                      <span style={styles.seriesProgressLabel}>{s.readCount} / {s.totalBooks}</span>
                    </div>
                  </div>
                );
              })}
            </div>
            {filteredSeries.length === 0 && <div style={styles.emptyState}>No series match yet.</div>}
          </div>
        )}

        {tab === "stats" && (
          <div>
            <div style={styles.sectionTitle}>Year over year</div>
            <div style={styles.tableWrap}>
              <table style={styles.table}>
                <thead>
                  <tr>
                    <th style={styles.th}>Year</th>
                    <th style={styles.th}>Goal</th>
                    <th style={styles.th}>Read</th>
                    <th style={styles.th}>% of goal</th>
                    <th style={styles.th}>Pages</th>
                    <th style={styles.th}>Audio hrs</th>
                  </tr>
                </thead>
                <tbody>
                  {allYears.map(y => {
                    const s = yearStats[y] || { read: 0, pages: 0, audio: 0 };
                    const g = Number(goals[y]) || 0;
                    const pct = g ? Math.round((s.read / g) * 100) : null;
                    return (
                      <tr key={y} style={y === currentYear ? styles.trCurrent : undefined}>
                        <td style={styles.td}>{y}</td>
                        <td style={styles.td}>{g || "—"}</td>
                        <td style={styles.td}>{s.read}</td>
                        <td style={styles.td}>{pct !== null ? `${pct}%` : "—"}</td>
                        <td style={styles.td}>{Math.round(s.pages).toLocaleString()}</td>
                        <td style={styles.td}>{s.audio.toFixed(1)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div style={styles.sectionBlock}>
              <div style={styles.sectionTitle}>Books finished per year</div>
              <div style={styles.barChart}>
                {allYears.slice().reverse().map(y => {
                  const s = yearStats[y] || { read: 0 };
                  const max = Math.max(1, ...allYears.map(yy => (yearStats[yy] || { read: 0 }).read));
                  const h = Math.max(2, (s.read / max) * 100);
                  return (
                    <div key={y} style={styles.barCol}>
                      <div style={styles.barTrack}>
                        <div style={{ ...styles.bar, height: `${h}%` }} title={`${s.read} books`} />
                      </div>
                      <div style={styles.barLabel}>{String(y).slice(2)}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {tab === "goals" && (
          <div>
            <div style={styles.sectionTitle}>Reading goals by year</div>
            <div style={styles.goalsList}>
              {allYears.map(y => (
                <div key={y} style={styles.goalRow}>
                  <span style={styles.goalYear}>{y}</span>
                  <input
                    style={styles.goalInput}
                    type="number"
                    min="0"
                    value={goals[y] ?? ""}
                    onChange={e => updateGoal(y, e.target.value)}
                    placeholder="0"
                  />
                  <span style={styles.goalSuffix}>books</span>
                  <span style={styles.goalActual}>{(yearStats[y] || { read: 0 }).read} read so far</span>
                </div>
              ))}
              <button
                style={styles.addYearBtn}
                onClick={() => {
                  const nextYear = Math.max(...allYears) + 1;
                  updateGoal(nextYear, 0);
                }}
              >
                <Plus size={14} /> Add next year
              </button>
            </div>
          </div>
        )}
      </div>

      {showAdd && (
        <div style={styles.modalOverlay} onClick={() => setShowAdd(false)}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <span>Add a book</span>
              <button style={styles.closeBtn} onClick={() => setShowAdd(false)}><X size={16} /></button>
            </div>

            <label style={styles.label}>Title</label>
            <input style={styles.input} value={newBook.title} onChange={e => setNewBook({ ...newBook, title: e.target.value })} placeholder="e.g. The Name of the Wind" />

            <label style={styles.label}>Author</label>
            <input style={styles.input} value={newBook.author} onChange={e => setNewBook({ ...newBook, author: e.target.value })} placeholder="optional — lookup can fill this in" />

            <button style={styles.lookupBtn} onClick={lookupDetails} disabled={lookupLoading}>
              {lookupLoading ? <Loader2 size={14} className="spin" /> : <Sparkles size={14} />}
              {lookupLoading ? "Searching the web…" : "Look up details"}
            </button>
            {lookupError && <div style={styles.lookupError}>{lookupError}</div>}
            {lookupDone && !lookupError && <div style={styles.lookupSuccess}>Filled in from web search — check it over below.</div>}

            <div style={styles.gridTwo}>
              <div>
                <label style={styles.label}>Series</label>
                <input style={styles.input} value={newBook.series} onChange={e => setNewBook({ ...newBook, series: e.target.value })} />
              </div>
              <div>
                <label style={styles.label}>Series #</label>
                <input style={styles.input} type="number" value={newBook.seriesNum} onChange={e => setNewBook({ ...newBook, seriesNum: e.target.value })} />
              </div>
            </div>
            <div style={styles.gridTwo}>
              <div>
                <label style={styles.label}>Pages</label>
                <input style={styles.input} type="number" value={newBook.pages} onChange={e => setNewBook({ ...newBook, pages: e.target.value })} />
              </div>
              <div>
                <label style={styles.label}>Audio hours</label>
                <input style={styles.input} type="number" step="0.1" value={newBook.audioHours} onChange={e => setNewBook({ ...newBook, audioHours: e.target.value })} />
              </div>
            </div>
            <label style={styles.label}>Genre</label>
            <input style={styles.input} value={newBook.genre} onChange={e => setNewBook({ ...newBook, genre: e.target.value })} placeholder="e.g. Fantasy" />

            <label style={styles.label}>Status</label>
            <select style={styles.input} value={newBook.status} onChange={e => setNewBook({ ...newBook, status: e.target.value })}>
              <option value="TBR">To Be Read</option>
              <option value="In Progress">Currently Reading</option>
              <option value="Read">Read</option>
              <option value="DNF">Did Not Finish</option>
            </select>

            <button style={styles.saveBtn} onClick={addBook}>Add to catalog</button>
          </div>
        </div>
      )}

      {editingBook && editDraft && (
        <div style={styles.modalOverlay} onClick={() => setEditingBook(null)}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <span>Edit entry</span>

            <button style={styles.lookupBtn} onClick={lookupEditDetails} disabled={editLookupLoading}>

            <div style={styles.gridTwo}>
              <div>
                <label style={styles.label}>Series</label>

              </div>
              <div>
                <label style={styles.label}>Series #</label>
                <input style={styles.input} type="number" value={editDraft.seriesNum} onChange={e => setEditDraft({ ...editDraft, seriesNum: e.target.value })} />
              </div>
            </div>
            <div style={styles.gridTwo}>
              <div>
                <label style={styles.label}>Pages</label>
                <input style={styles.input} type="number" value={editDraft.pages} onChange={e => setEditDraft({ ...editDraft, pages: e.target.value })} />
              </div>

            </div>
            <label style={styles.label}>Genre</label>
            <input style={styles.input} value={editDraft.genre} onChange={e => setEditDraft({ ...editDraft, genre: e.target.value })} />

            <label style={styles.label}>Status</label>
            <select style={styles.input} value={editDraft.status} onChange={e => setEditDraft({ ...editDraft, status: e.target.value })}>

              <option value="In Progress">Currently Reading</option>
              <option value="Read">Read</option>
              <option value="DNF">Did Not Finish</option>
            </select>

            <div style={styles.gridTwo}>
              <div>
                <label style={styles.label}>Date started</label>
                <input style={styles.input} type="date" value={editDraft.dateStarted} onChange={e => setEditDraft({ ...editDraft, dateStarted: e.target.value })} />
              </div>
              <div>
                <label style={styles.label}>Date finished</label>
                <input style={styles.input} type="date" value={editDraft.dateCompleted} onChange={e => setEditDraft({ ...editDraft, dateCompleted: e.target.value })} />
              </div>
            </div>

            <button style={styles.saveBtn} onClick={saveEdit}>Save changes</button>
            <button
              style={styles.deleteEntryBtn}
              onClick={() => { deleteBook(editingBook.id); setEditingBook(null); }}
            >
              <Trash2 size={13} /> Remove from catalog
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function SignInScreen({ onSignIn, error }) {
  return (
    <div style={styles.loadingScreen}>
      <div style={{ fontFamily: "'Fraunces', serif", fontStyle: "italic", fontWeight: 600, fontSize: 30, color: "#EFE7D2", marginBottom: 6 }}>
        The Reading Ledger
      </div>
      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: "#8B8676", marginBottom: 24, textAlign: "center", maxWidth: 300 }}>
        sign in to open your catalog — your data is private to your account
      </div>
      <button
        onClick={onSignIn}
        style={{
          display: "flex", alignItems: "center", gap: 8,
          background: "#EFE7D2", color: "#2A2118", border: "none",
          borderRadius: 4, padding: "10px 18px", fontSize: 14, fontWeight: 600, cursor: "pointer",
        }}
      >
        Sign in with Google
      </button>
      {error && <div style={{ color: "#C97A63", fontSize: 12, marginTop: 14 }}>{error}</div>}
    </div>
  );
}

function App() {
  const [authLoading, setAuthLoading] = useState(true);
  const [user, setUser] = useState(null);
  const [authError, setAuthError] = useState("");

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged(u => {
      setUser(u);
      setAuthLoading(false);
    });
    return () => unsub();
  }, []);

  function handleSignIn() {
    setAuthError("");
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).catch(e => setAuthError(e.message));
  }

  function handleSignOut() {
    firebase.auth().signOut();
  }

  if (authLoading) {
    return (
      <div style={styles.loadingScreen}>
        <Loader2 className="spin" size={28} />
      </div>
    );
  }

  if (!user) {
    return <SignInScreen onSignIn={handleSignIn} error={authError} />;
  }

  return <ReadingLedger uid={user.uid} email={user.email} onSignOut={handleSignOut} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

  </script>
