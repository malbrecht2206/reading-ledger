<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Reading Ledger</title>

  <!-- Browser tab icon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icon-16.png" />

  <!-- iOS "Add to Home Screen" icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <meta name="apple-mobile-web-app-title" content="Reading Ledger" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Android / PWA "Add to Home Screen" -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#162420" />

  <style>
    :root {
      --app-bg: #0f1813; --loading-bg: #131f19; --modal-bg: #1c2f26;
      --text-muted: #8B8676; --parchment: #EFE7D2; --accent: #B8874A;
      --stamp-red: #A13D2D; --card-text: #2A2118; --dates-green: #6E7F52;
      --complete-green: #4C7A5D; --text-main: #C9C2AC; --card-text-muted: #5A4E38;
      --card-text-faint: #8A7A5C; --series-purple: #8A7CB0; --btn-text-on-accent: #1a140c;
      --tab-inactive: #9a9482; --card-title: #231B12; --error-text: #C97A63;
      --success-text: #8FAF8B; --scrollbar: #3a4a3f; --series-text: #7A6B4C;
      --quote-text: #4A4030; --accent-shadow: #7A5C33;
    }
    html, body { margin: 0; padding: 0; background: #0f1813; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React (no build step needed) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Firebase (compat build - works with plain <script> tags, no bundler required) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>

  <!-- The app itself. We fetch and transform it manually (instead of using Babel's automatic
       <script type="text/babel"> scanning) because that auto-scanner defaults to React's
       "automatic" JSX runtime, which compiles JSX into `import ... from "react/jsx-runtime"`
       calls - a real ES module import that can't run in a plain script tag. We explicitly
       request the "classic" runtime instead, which compiles to plain React.createElement(...)
       calls using the global `React` we loaded above. -->
  <script>
    fetch('app.jsx?v=9')
      .then(r => r.text())
      .then(src => {
        var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
        var s = document.createElement('script');
        s.textContent = out;
        document.body.appendChild(s);
      })
      .catch(err => {
        document.getElementById('root').innerHTML =
          '<pre style="color:#f66;padding:20px;">Failed to load app.jsx: ' + err + '</pre>';
      });
  </script>
</body>
</html>
